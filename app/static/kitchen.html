<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Køkkenets bestillinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Køkkenets side (uden login): dagens bestillinger i leveringsrækkefølge, en samlet pakkeliste og knapper til
   "Bekræft" og "Leveret". Til en tablet i køkkenet eller til print. Mødernes titler vises aldrig her. */
:root{--ink:#14171d;--soft:#5d6470;--paper:#f5f3ef;--card:#fff;--rule:#e4e1dc;--brand:#12352e;--ok:#127a4c;--ok-bg:#e3f4ea;
  --new:#b86a00;--new-bg:#fff2dc;--bad:#b42318;--bad-bg:#fde8e6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
.hw{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font:800 1.45rem var(--f-display);margin:0;letter-spacing:-.01em}
.hw .sub{opacity:.8;font-size:.9rem}
.sp{flex:1}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button,.tools button{font:700 .88rem var(--f-body);border-radius:999px;border:1px solid rgb(255 255 255 / .35);background:none;color:#fff;min-height:36px;padding:0 14px;cursor:pointer}
.days button[aria-pressed="true"]{background:#fff;color:var(--brand);border-color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:12px}
.o{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--new);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:90px 1fr auto;gap:6px 16px}
.o.confirmed{border-left-color:var(--brand)}
.o.delivered{border-left-color:var(--ok);opacity:.65}
.o.cancelled{border-left-color:var(--bad);opacity:.6}
.o.cancelled .lines{text-decoration:line-through}
.t{font:600 1.6rem/1 var(--f-mono)}
.t small{display:block;font:500 .72rem var(--f-body);color:var(--soft);margin-top:6px}
.w b{font:700 1.15rem var(--f-display)}
.w .m{color:var(--soft);font-size:.9rem}
.lines{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.lines li{display:flex;gap:10px}
.lines .q{font:600 1rem var(--f-mono);min-width:44px;text-align:right}
.note{margin-top:8px;background:var(--new-bg);border-radius:10px;padding:6px 10px;font-weight:600;font-size:.92rem}
.acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:140px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;text-align:center}
.pill.new{background:var(--new-bg);color:var(--new)} .pill.confirmed{background:#e3ece9;color:var(--brand)}
.pill.delivered{background:var(--ok-bg);color:var(--ok)} .pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.acts button{font:700 .95rem var(--f-body);border-radius:12px;border:0;min-height:48px;padding:0 14px;cursor:pointer;background:var(--brand);color:#fff}
.acts button.ghost{background:#fff;border:1px solid var(--rule);color:var(--ink);min-height:38px;font-size:.85rem}
.tot{font:500 .85rem var(--f-mono);color:var(--soft);text-align:right}
aside{position:sticky;top:84px;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px}
aside h2{font:700 1.05rem var(--f-display);margin:0 0 10px}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
aside li{display:flex;gap:10px;border-bottom:1px dashed var(--rule);padding-bottom:6px}
aside li .q{font:600 1rem var(--f-mono);min-width:44px;text-align:right}
.empty{background:var(--card);border-radius:16px;padding:28px;text-align:center;color:var(--soft)}
.upd{font:500 .75rem var(--f-mono);color:var(--soft);margin-top:12px}
@media (max-width:820px){main{grid-template-columns:1fr}aside{position:static;order:-1}.o{grid-template-columns:70px 1fr}.acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}.acts button{flex:1}}
@media print{header{position:static;background:none;color:#000}.days,.tools,.acts button{display:none}main{grid-template-columns:1fr}aside{position:static}.o{break-inside:avoid}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="hw">
  <div><h1 id="name">Bestillinger</h1><div class="sub" id="sub"></div></div><span class="sp"></span>
  <div class="days" id="days" role="group" aria-label="Vælg dag"></div>
  <div class="tools"><button type="button" id="print">Print</button></div>
</div></header>
<main>
  <div class="list" id="list"></div>
  <aside id="pack" hidden><h2>Samlet for dagen</h2><ul id="packList"></ul><div class="upd" id="upd"></div></aside>
</main>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const token = decodeURIComponent(location.pathname.split("/").pop());
  const api = "/api/kitchen/" + encodeURIComponent(token);
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const hm = (s) => { const d = new Date(s); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  let day = iso(new Date()), data = null;

  function days() {
    const d = new Date(), out = [];
    for (let i = 0; i < 5; i++) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      const label = i === 0 ? "I dag" : i === 1 ? "I morgen" : x.toLocaleDateString("da-DK", { weekday: "short", day: "numeric" }).replace(".", "");
      out.push('<button type="button" data-day="' + iso(x) + '" aria-pressed="' + (iso(x) === day) + '">' + esc(label) + "</button>");
    }
    $("days").innerHTML = out.join("");
  }

  const NEXT = { new: ["confirmed", "Bekræft"], confirmed: ["delivered", "Leveret"] };

  function render() {
    const os = data.orders;
    const live = os.filter((o) => o.status !== "cancelled");
    const dl = new Date(day + "T12:00").toLocaleDateString("da-DK", { weekday: "long", day: "numeric", month: "long" });
    $("sub").textContent = dl.charAt(0).toUpperCase() + dl.slice(1) + " · " + live.length + (live.length === 1 ? " bestilling" : " bestillinger");
    $("list").innerHTML = os.length ? os.map((o) => '<article class="o ' + esc(o.status) + '" data-id="' + o.id + '"><div class="t">' + hm(o.deliver_at) +
      "<small>Møde " + esc(o.meeting) + '</small></div><div class="w"><b>' + esc(o.room) + "</b>" + (o.location ? ' <span class="m">· ' + esc(o.location) + "</span>" : "") +
      '<div class="m">' + esc([o.firm, o.organizer, o.attendees ? o.attendees + " deltagere" : "", o.cost_center ? "Omk.sted: " + o.cost_center : ""].filter(Boolean).join(" · ")) + "</div>" +
      '<ul class="lines">' + o.lines.map((l) => '<li><span class="q">' + l.qty + " ×</span><span>" + esc(l.name) + ' <span class="m">' + esc(l.unit) + "</span></span></li>").join("") + "</ul>" +
      (o.note ? '<div class="note">⚠ ' + esc(o.note) + "</div>" : "") + '</div><div class="acts"><span class="pill ' + esc(o.status) + '">' + esc(o.status_text) + "</span>" +
      (NEXT[o.status] ? '<button type="button" data-set="' + NEXT[o.status][0] + '">' + NEXT[o.status][1] + "</button>" : "") +
      (o.status === "delivered" ? '<button type="button" class="ghost" data-set="confirmed">Fortryd</button>' : "") +
      '<div class="tot">' + esc(o.total_text) + "</div></div></article>").join("") :
      '<div class="empty">Ingen bestillinger denne dag.</div>';
    // Pakkeliste: alt for dagen lagt sammen.
    const sum = new Map();
    live.forEach((o) => o.lines.forEach((l) => { const k = l.name + "|" + l.unit; sum.set(k, (sum.get(k) || 0) + l.qty); }));
    $("pack").hidden = !sum.size;
    $("packList").innerHTML = [...sum.entries()].sort((a, b) => a[0].localeCompare(b[0], "da")).map(([k, q]) => {
      const [n, u] = k.split("|"); return '<li><span class="q">' + q + " ×</span><span>" + esc(n) + ' <span class="m">' + esc(u) + "</span></span></li>";
    }).join("");
  }

  async function load() {
    try {
      const r = await fetch(api + "?date=" + day, { cache: "no-store" });
      const j = await r.json();
      if (!r.ok) { document.querySelector("main").innerHTML = '<div class="empty">' + esc(j.detail || "Linket virker ikke") + "</div>"; return; }
      data = j; $("name").textContent = j.kitchen.name; document.title = j.kitchen.name + " · bestillinger";
      render();
      $("upd").textContent = "Opdateret " + new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { $("upd").textContent = "Ingen forbindelse. Listen vises som sidst."; }
  }

  $("days").addEventListener("click", (e) => { const b = e.target.closest("[data-day]"); if (!b) return; day = b.dataset.day; days(); load(); });
  $("print").addEventListener("click", () => window.print());
  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-set]"); if (!b) return;
    const id = b.closest("[data-id]").dataset.id;
    b.disabled = true;
    try {
      const r = await fetch(api + "/orders/" + id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: b.dataset.set }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); alert(j.detail || "Det gik ikke. Prøv igen"); }
    } catch (err) { alert("Ingen forbindelse. Prøv igen"); }
    load();
  });
  days(); load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
