<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Min arbejdstid</title>
<link rel="icon" href="/static/brand/nodd-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/nodd-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Medarbejderens egen side (personligt link): stempl ind og ud, og se sine registreringer (lovens krav om adgang).
   Spørger kun serveren, når siden åbnes eller der trykkes. Uret tæller i browseren. --brand = firmaets farve. */
:root{--brand:#12352e;--ink:#14171d;--soft:#5d6470;--paper:#f4f5f2;--card:#fff;--rule:#e2e4e0;--ok:#14955f;--bad:#cf3a30;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;gap:12px}
.logo{height:46px;min-width:84px;background:#fff;border:1px solid var(--rule);border-radius:12px;display:grid;place-items:center;padding:6px 12px}
.logo img{max-height:32px;max-width:130px;object-fit:contain}
.logo b{font-family:var(--f-display)}
.head small{color:var(--soft);display:block;font-size:.85rem}
.head strong{font-family:var(--f-display);font-size:1.1rem}
h1{font:700 1.8rem/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.status{align-items:center;text-align:center;padding:24px 18px}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--soft);display:inline-block;margin-right:8px;vertical-align:middle}
.status.in .dot{background:var(--ok);box-shadow:0 0 0 6px rgb(20 149 95 / .15)}
.status p{margin:0;color:var(--soft)}
.status .big{font:700 2.6rem/1 var(--f-mono);color:var(--ink);letter-spacing:-.02em}
.go{width:100%;min-height:64px;border:0;border-radius:16px;background:var(--brand);color:#fff;font:700 1.25rem var(--f-display);cursor:pointer}
.status.in .go{background:var(--bad)}
.go:disabled{opacity:.6}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 14px}
.num span{display:block;font-size:.78rem;font-weight:700;color:var(--soft)}
.num b{font:700 1.4rem var(--f-mono)}
.weekh{display:flex;align-items:center;gap:8px}
.weekh h2{flex:1;margin:0;font:700 1.1rem var(--f-display);text-align:center}
.nav{border:1px solid var(--rule);background:#fff;border-radius:12px;min-width:44px;min-height:40px;font-size:1.1rem;cursor:pointer}
.nav:disabled{opacity:.35}
ul{list-style:none;margin:0;padding:0}
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:flex-start}
.day:first-child{border-top:0}
.day .d{width:84px;flex:none;font-weight:700;white-space:nowrap}
.day .d.today{color:var(--brand)}
.day .e{flex:1;display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:.92rem}
.day .e small{font-family:var(--f-body);color:var(--soft)}
.day .e .miss{color:var(--bad);font-family:var(--f-body);font-weight:700}
.day .m{font:500 .95rem var(--f-mono);white-space:nowrap}
.muted{color:var(--soft)}
.foot{color:var(--soft);font-size:.85rem;text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;
  font-weight:700;max-width:calc(100% - 32px);text-align:center}
.err{color:var(--bad)}
</style>
</head>
<body>
<main id="app"><p class="muted">Henter …</p></main>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TOKEN = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  const hm = (m) => Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0");
  const clock = (iso) => iso ? iso.slice(11, 16) : "";
  let D = null, week = null, tick = null, busy = false;

  async function load() {
    try {
      const r = await fetch("/api/time/" + encodeURIComponent(TOKEN) + (week ? "?week=" + week : ""));
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || "Siden kunne ikke hentes");
      D = data; render();
    } catch (e) { $("app").innerHTML = '<div class="card"><h1>Min arbejdstid</h1><p class="err">' + esc(e.message) + "</p></div>"; }
  }
  function sinceMin() { return D.since ? Math.max(0, Math.floor((Date.now() - new Date(D.since).getTime()) / 60000)) : 0; }
  function render() {
    document.documentElement.style.setProperty("--brand", D.color || "#12352e");
    const isThisWeek = !week;
    $("app").innerHTML =
      '<div class="head"><div class="logo">' + (D.logo_url ? '<img src="' + esc(D.logo_url) + '" alt="">' : "<b>" + esc(D.firm) + "</b>") + "</div><div><small>" + esc(D.firm) + "</small><strong>Min arbejdstid</strong></div></div>" +
      "<h1>Hej " + esc(D.name.split(" ")[0]) + "</h1>" +
      '<div class="card status' + (D.inside ? " in" : "") + '"><p><span class="dot"></span>' + (D.inside ? "Stemplet ind kl. " + clock(D.since) : "Du er ikke stemplet ind") + "</p>" +
      (D.inside ? '<div class="big" id="run">' + hm(sinceMin()) + "</div>" : "") +
      '<button class="go" type="button" id="go">' + (D.inside ? "Stempl ud" : "Stempl ind") + "</button></div>" +
      '<div class="nums"><div class="num"><span>I dag</span><b id="todayN">' + hm(D.today) + '</b></div><div class="num"><span>Denne måned</span><b>' + hm(D.month) + "</b></div></div>" +
      '<div class="card"><div class="weekh"><button class="nav" type="button" id="prev" aria-label="Forrige uge">‹</button><h2>Uge ' + D.week + '</h2><button class="nav" type="button" id="next" aria-label="Næste uge"' + (isThisWeek ? " disabled" : "") + ">›</button></div><ul>" +
      D.days.map((d) => '<li class="day"><span class="d' + (d.date === localIso(new Date()) ? " today" : "") + '">' + esc(d.label) + '</span><span class="e">' +
        (d.entries.length ? d.entries.map((e) => "<span>" + clock(e.start) + "–" + (e.end ? clock(e.end) : (e.stale ? '<span class="miss">mangler ud</span>' : "nu")) + (e.break_min ? " <small>(pause " + e.break_min + " min.)</small>" : "") +
          (e.approved ? " <small>✓ godkendt</small>" : "") + (e.edits && e.edits.some((x) => x.what === "rettet") ? " <small>rettet</small>" : "") + "</span>").join("") : '<small>–</small>') +
        '</span><span class="m">' + (d.minutes ? hm(d.minutes) : "") + "</span></li>").join("") + "</ul>" +
      '<p class="muted"><b>I alt ' + hm(D.total) + "</b>" + (D.norm ? " af " + hm(D.norm) + " (normtid)" : "") + "</p></div>" +
      '<p class="foot">Er noget forkert, så kontakt din administrator. Gem siden på hjemmeskærmen, så har du den ved hånden.</p>';
    $("go").addEventListener("click", go);
    $("prev").addEventListener("click", () => { const m = new Date(D.monday + "T12:00"); m.setDate(m.getDate() - 7); week = localIso(m); load(); });
    $("next").addEventListener("click", () => { const m = new Date(D.monday + "T12:00"); m.setDate(m.getDate() + 7); week = m >= mondayNow() ? null : localIso(m); load(); });
    clearInterval(tick);
    if (D.inside) tick = setInterval(() => { const r = $("run"); if (r) r.textContent = hm(sinceMin()); }, 15000);
  }
  function localIso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function mondayNow() { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
  async function go() {
    if (busy) return; busy = true; $("go").disabled = true;
    try {
      const r = await fetch("/api/time/" + encodeURIComponent(TOKEN) + "/clock", { method: "POST" });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || "Det gik ikke. Prøv igen.");
      toast(data.state === "in" ? "Velkommen, " + data.first + ". Stemplet ind kl. " + data.hhmm : "Tak for i dag, " + data.first + ". Stemplet ud kl. " + data.hhmm + " (" + data.today + " i dag)");
      week = null; await load();
    } catch (e) { toast(e.message); }
    busy = false; const b = $("go"); if (b) b.disabled = false;
  }
  let tT;
  function toast(m) { const x = $("toast"); x.textContent = m; x.hidden = false; clearTimeout(tT); tT = setTimeout(() => (x.hidden = true), 4000); }
  load();
})();
</script>
</body>
</html>
