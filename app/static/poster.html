<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plakat · {{name}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hanken+Grotesk:wght@400;600;700&display=swap">
<style>
/* A4-plakat til døren. Printes fra browseren (Ctrl+P). Kundens farve i toppen, QR-koden i midten. */
@page{size:A4;margin:0}
:root{--brand:{{color}};color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#e9eae6}
body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:#14171d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:210mm;margin:16px auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px}
.bar button{font:700 15px "Hanken Grotesk",sans-serif;background:#14171d;color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
.sheet{width:210mm;height:297mm;margin:0 auto 24px;background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px -20px rgb(0 0 0 / .4)}
.top{background:var(--brand);color:#fff;padding:22mm 18mm 16mm;display:flex;flex-direction:column;gap:10mm}
.logo{background:#fff;border-radius:6mm;height:30mm;display:grid;place-items:center;padding:5mm 9mm;align-self:flex-start;min-width:70mm}
.logo img{max-height:20mm;max-width:120mm;object-fit:contain}
.logo b{color:#14171d;font:700 9mm "Bricolage Grotesque",sans-serif}
h1{font:800 19mm/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0}
.top p{font-size:7mm;margin:0;opacity:.9}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9mm;padding:10mm 18mm}
.qr{width:120mm;height:120mm;display:grid;place-items:center;border:1.2mm solid #14171d;border-radius:8mm;padding:6mm}
.qr svg{width:100%;height:auto}
ol{font-size:6.2mm;line-height:1.5;margin:0;padding-left:8mm}
.foot{padding:0 18mm 12mm;color:#5d6470;font-size:3.6mm;word-break:break-all}
@media print{.bar{display:none}html,body{background:#fff}.sheet{margin:0;box-shadow:none}}
</style>
</head>
<body>
<div class="bar"><span>Print på A4 og hæng den ved døren. Gæsten scanner koden og tjekker ind på sin egen telefon.</span><button type="button" onclick="window.print()">Print</button></div>
<div class="sheet">
  <div class="top">
    <div class="logo">{{logo}}</div>
    <h1>Velkommen.<br>Tjek ind her.</h1>
    <p>Welcome. Scan to check in.</p>
  </div>
  <div class="mid">
    <div class="qr">{{qr}}</div>
    <ol><li>Scan koden med kameraet på din telefon</li><li>Vælg hvem du skal besøge</li><li>Vi giver dem besked med det samme</li></ol>
  </div>
  <div class="foot">{{url}}</div>
</div>
</body>
</html>
