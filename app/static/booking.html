<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Book et mødelokale</title>
<link rel="icon" href="/static/brand/nodd-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/nodd-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Værtens bookingside (fra det personlige link): vælg dag, se lokalerne med billeder og ledige tider, book med få tryk.
   Andre firmaers møder vises kun som "Optaget". --brand = kundens farve. */
:root{--brand:#12352e;--ink:#14171d;--soft:#5d6470;--paper:#f4f5f2;--card:#fff;--rule:#e2e4e0;--ok:#14955f;--bad:#cf3a30;
  --busy:#e9ebe7;--busy-ink:#5d6470;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:50px;min-width:90px;background:#fff;border:1px solid var(--rule);border-radius:12px;display:grid;place-items:center;padding:6px 12px}
.logo img{max-height:34px;max-width:140px;object-fit:contain}
.logo b{font-family:var(--f-display)}
.head small{color:var(--soft);display:block}
.head strong{font-family:var(--f-display);font-size:1.15rem}
.head .sp{flex:1}
.head a{color:var(--brand);font-weight:700;text-decoration:none;font-size:.9rem}
h1{font-family:var(--f-display);font-size:1.9rem;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.day{flex:none;scroll-snap-align:start;border:1px solid var(--rule);background:#fff;border-radius:14px;padding:8px 12px;min-width:64px;
  text-align:center;cursor:pointer;font:inherit;color:inherit}
.day small{display:block;color:var(--soft);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.day b{font:700 1.25rem var(--f-display)}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.day[aria-pressed="true"] small{color:rgb(255 255 255 / .8)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:.85rem;font-weight:700;color:var(--soft);display:flex;flex-direction:row;gap:8px;align-items:center}
.filters select{font:600 .95rem var(--f-body);border:1px solid var(--rule);border-radius:999px;padding:8px 12px;background:#fff}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.room{background:var(--card);border:1px solid var(--rule);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:16/8;background:linear-gradient(135deg,color-mix(in oklab,var(--brand) 82%,#fff),var(--brand));position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ini{position:absolute;inset:0;display:grid;place-items:center;color:rgb(255 255 255 / .9);font:700 2.4rem var(--f-display)}
.ph .tag{position:absolute;left:12px;top:12px;background:rgb(255 255 255 / .92);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700}
.ph .tag.free{color:var(--ok)}
.ph .tag.busy{color:var(--bad)}
.rb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rt h3{font:700 1.2rem var(--f-display);margin:0}
.rt span{color:var(--soft);font-size:.85rem;white-space:nowrap}
.desc{color:var(--soft);font-size:.9rem;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;color:var(--soft)}
.tl{position:relative;height:42px;border-radius:10px;background:repeating-linear-gradient(90deg,#fff 0 calc(100%/24 - 1px),var(--rule) calc(100%/24 - 1px) calc(100%/24));
  border:1px solid var(--rule);cursor:pointer;overflow:hidden;touch-action:manipulation}
.tl .b{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--busy);color:var(--busy-ink);font-size:.7rem;font-weight:700;
  padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;pointer-events:none}
.tl .b.mine{background:color-mix(in oklab,var(--brand) 85%,#fff);color:#fff}
.tl .past{position:absolute;top:0;bottom:0;left:0;background:rgb(244 245 242 / .75);pointer-events:none}
.tl .nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none}
.hours{display:flex;justify-content:space-between;font:500 .7rem var(--f-mono);color:var(--soft);margin-top:-4px}
.rb .pri{margin-top:auto}
button{font:700 1rem var(--f-body);border-radius:999px;border:0;cursor:pointer;min-height:46px;padding:0 20px}
.pri{background:var(--brand);color:#fff}
.ghost{background:#fff;border:1px solid var(--rule);min-height:36px;padding:0 14px;font-size:.85rem;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--soft)}
.empty{color:var(--soft)}
.foot{color:var(--soft);font-size:.8rem;text-align:center}
/* skuffen */
.veil{position:fixed;inset:0;background:rgb(15 18 22 / .45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--paper);width:min(520px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;
  box-shadow:-20px 0 50px rgb(0 0 0 / .2);animation:in .22s ease-out}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.dh{position:relative;aspect-ratio:16/7;background:linear-gradient(135deg,color-mix(in oklab,var(--brand) 82%,#fff),var(--brand));flex:none}
.dh img{width:100%;height:100%;object-fit:cover;display:block}
.dh .x{position:absolute;right:12px;top:max(12px,env(safe-area-inset-top,0px));width:42px;height:42px;min-height:0;padding:0;border-radius:50%;
  background:rgb(255 255 255 / .95);font-size:1.3rem;line-height:1}
.dh h2{position:absolute;left:18px;bottom:14px;color:#fff;font-size:1.6rem;text-shadow:0 2px 12px rgb(0 0 0 / .45)}
form.db{padding:18px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:700;color:var(--soft)}
input,select,textarea{font:500 1rem var(--f-body);border:1px solid var(--rule);border-radius:11px;padding:11px 12px;background:#fff;min-width:0;width:100%;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab,var(--brand) 18%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;background:#fff;border:1px solid var(--rule);font-size:.9rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:12px;background:#fff;width:max-content}
.step button{min-height:44px;width:48px;padding:0;background:none;font-size:1.3rem;color:var(--brand)}
.step input{border:0;width:64px;text-align:center;font:700 1.1rem var(--f-mono);padding:0;box-shadow:none!important;background:none}
.sum{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:.92rem}
.sum b{font-weight:700}
.sum .tm{font-family:var(--f-mono);font-weight:500}
.err{color:var(--bad);font-weight:600;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;
  font-weight:700;z-index:30;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
@media (max-width:520px){.drawer{width:100%}.rooms{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="main">
  <div class="head"><div class="logo" id="logo"></div><div><small>Booking for</small><strong id="host"></strong></div><span class="sp"></span><a id="inviteLink" href="#">Invitér en gæst →</a></div>
  <h1>Book et mødelokale</h1>
  <div class="days" id="days" role="group" aria-label="Vælg dag"></div>
  <div class="filters" id="filters" hidden><label>Antal personer <select id="people"><option value="0">Alle lokaler</option></select></label></div>
  <div class="rooms" id="rooms"></div>
  <section class="card"><h2>Dine bookinger</h2><div class="list" id="mine"></div></section>
  <p class="foot">Tryk på et ledigt tidspunkt på tidslinjen for at starte bookingen der. Linket er personligt, så del det ikke.</p>
</main>
<div class="veil" id="veil" hidden>
  <div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="dh" id="dPhoto"><button type="button" class="x" id="dClose" aria-label="Luk">×</button><h2 id="dTitle"></h2></div>
    <form class="db" id="form" autocomplete="off">
      <label>Mødets titel<input name="title" maxlength="200" placeholder="Fx Kundemøde med Acme"></label>
      <div class="row">
        <label>Starter<input name="start" type="time" step="900" required></label>
        <label>Slutter<input name="end" type="time" step="900" required></label>
      </div>
      <div><div class="lbl">Varighed</div><div class="seg" id="dur">
        <button type="button" data-m="30">30 min</button><button type="button" data-m="60">1 time</button>
        <button type="button" data-m="90">1½ time</button><button type="button" data-m="120">2 timer</button><button type="button" data-m="240">Halv dag</button>
      </div></div>
      <div><div class="lbl">Antal deltagere</div><div class="step"><button type="button" id="minus" aria-label="Færre">−</button><input name="attendees" type="number" min="0" max="1000" value="2" inputmode="numeric" aria-label="Antal deltagere"><button type="button" id="plus" aria-label="Flere">+</button></div></div>
      <div id="setupBox"><div class="lbl">Opstilling</div><div class="seg" id="setups"></div></div>
      <div id="equipBox"><div class="lbl">Udstyr</div><div class="seg" id="equip"></div></div>
      <label>Bemærkninger<textarea name="note" maxlength="1000" placeholder="Fx ekstra stole eller adgang fra kl. 8"></textarea></label>
      <div class="sum" id="sum"></div>
      <p class="err" id="err" hidden></p>
      <button class="pri" type="submit" id="send">Book lokalet</button>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const token = decodeURIComponent(location.pathname.split("/").pop());
  const api = "/api/book/" + encodeURIComponent(token);
  let H0 = 7, H1 = 19;  // tidslinjen: normalt 07–19, men udvides, så aftenmøder og "nu" kan ses
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const hm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
  let day = iso(new Date()), data = null, room = null, sel = { setup: "", equipment: new Set() };
  $("inviteLink").href = "/i/" + encodeURIComponent(token);

  function days() {
    const out = [], d = new Date();
    for (let i = 0; i < 21; i++) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + i);
      const wd = i === 0 ? "I dag" : i === 1 ? "I morgen" : x.toLocaleDateString("da-DK", { weekday: "short" }).replace(".", "");
      out.push('<button type="button" class="day" data-day="' + iso(x) + '" aria-pressed="' + (iso(x) === day) + '"><small>' + wd +
        "</small><b>" + x.getDate() + "</b><small>" + x.toLocaleDateString("da-DK", { month: "short" }).replace(".", "") + "</small></button>");
    }
    $("days").innerHTML = out.join("");
  }

  const minutesOf = (d) => d.getHours() * 60 + d.getMinutes();
  const pct = (m) => Math.max(0, Math.min(100, 100 * (m - H0 * 60) / ((H1 - H0) * 60)));

  function freeNow(r) {
    const now = new Date();
    if (day !== iso(now)) return null;
    return !data.bookings.some((b) => b.room_id === r.id && new Date(b.start) <= now && new Date(b.end) > now);
  }

  function renderRooms() {
    const ppl = +$("people").value;
    const rooms = data.rooms.filter((r) => !ppl || !r.capacity || r.capacity >= ppl);
    const now = new Date(), today = day === iso(now);
    H0 = 7; H1 = 19;
    const mark = (m) => { H0 = Math.min(H0, Math.floor(m / 60)); H1 = Math.max(H1, Math.ceil(m / 60)); };
    if (today) { mark(minutesOf(now)); mark(minutesOf(now) + 120); }
    data.bookings.forEach((b) => { mark(fromMin(b.start)); mark(fromMin(b.end)); });
    H0 = Math.max(0, H0); H1 = Math.min(24, H1);
    const ticks = [0, 1, 2, 3, 4].map((i) => pad(Math.round(H0 + (H1 - H0) * i / 4) % 24));
    $("rooms").innerHTML = rooms.length ? rooms.map((r) => {
      const bs = data.bookings.filter((b) => b.room_id === r.id);
      const blocks = bs.map((b) => {
        const s = new Date(b.start), e = new Date(b.end);
        const l = pct(fromMin(b.start)), w = pct(fromMin(b.end)) - l;
        return w > 0 ? '<span class="b' + (b.mine ? " mine" : "") + '" style="left:' + l + "%;width:" + w + '%" title="' +
          esc(hm(s) + "–" + hm(e) + " " + b.title) + '">' + esc(w > 12 ? b.title : "") + "</span>" : "";
      }).join("");
      const fn = freeNow(r);
      const tag = fn === null ? "" : '<span class="tag' + (fn ? " free" : " busy") + '">' + (fn ? "● Ledigt nu" : "● Optaget nu") + "</span>";
      const photo = r.photo_url ? '<img src="' + esc(r.photo_url) + '" alt="" loading="lazy">' : '<span class="ini">' + esc(r.name.slice(0, 1)) + "</span>";
      const chips = [r.capacity ? "👥 " + r.capacity : "", ...r.equipment].filter(Boolean).map((c) => '<span class="chip">' + esc(c) + "</span>").join("");
      return '<article class="room"><div class="ph">' + photo + tag + '</div><div class="rb"><div class="rt"><h3>' + esc(r.name) + "</h3><span>" +
        esc(r.location) + "</span></div>" + (r.description ? '<p class="desc">' + esc(r.description) + "</p>" : "") +
        (chips ? '<div class="chips">' + chips + "</div>" : "") +
        '<div class="tl" data-room="' + r.id + '" role="button" tabindex="0" aria-label="Tidslinje for ' + esc(r.name) + ', tryk for at booke">' +
        (today ? '<span class="past" style="width:' + pct(minutesOf(now)) + '%"></span><span class="nowl" style="left:' + pct(minutesOf(now)) + '%"></span>' : "") +
        blocks + '</div><div class="hours">' + ticks.map((x) => "<span>" + x + "</span>").join("") + "</div>" +
        '<button type="button" class="pri" data-book="' + r.id + '">Book ' + esc(r.name) + "</button></div></article>";
    }).join("") : '<div class="card empty">' + (data.rooms.length ? "Ingen lokaler har plads til så mange." : "Der er ingen mødelokaler at booke endnu.") + "</div>";
  }

  function renderMine() {
    const mine = data.bookings.filter((b) => b.mine);
    const name = (id) => (data.rooms.find((r) => r.id === id) || {}).name || "";
    $("mine").innerHTML = mine.length ? mine.map((b) => '<div class="item"><div class="grow"><b>' + esc(b.title || "Møde") + "</b><small>" +
      esc(name(b.room_id) + " · " + hm(new Date(b.start)) + "–" + hm(new Date(b.end)) + (b.attendees ? " · " + b.attendees + " pers." : "")) +
      '</small></div><button type="button" class="ghost" data-cancel="' + b.id + '">Aflys</button></div>').join("") :
      '<p class="empty">Ingen bookinger denne dag.</p>';
  }

  async function load() {
    const r = await fetch(api + "?date=" + day, { cache: "no-store" });
    const j = await r.json();
    if (!r.ok) { $("main").innerHTML = '<div class="card"><h1>Linket virker ikke</h1><p>' + esc(j.detail || "") + "</p></div>"; return; }
    data = j;
    document.documentElement.style.setProperty("--brand", j.color || "#12352e");
    $("host").textContent = j.host + " · " + j.firm;
    $("logo").innerHTML = j.logo_url ? '<img src="' + esc(j.logo_url) + '" alt="' + esc(j.firm) + '">' : "<b>" + esc(j.firm) + "</b>";
    const caps = [...new Set(j.rooms.map((r) => r.capacity).filter(Boolean))].sort((a, b) => a - b);
    $("filters").hidden = caps.length < 2;
    const cur = $("people").value;
    $("people").innerHTML = '<option value="0">Alle lokaler</option>' + caps.map((c) => '<option value="' + c + '">' + c + "+ personer</option>").join("");
    $("people").value = caps.includes(+cur) ? cur : "0";
    renderRooms(); renderMine();
  }

  // ---------- skuffen ----------
  function suggestStart(clickMin) {
    const now = new Date();
    let m = clickMin != null ? Math.floor(clickMin / 15) * 15 : (day === iso(now) ? Math.ceil((minutesOf(now) + 5) / 15) * 15 : 9 * 60);
    if (day === iso(now)) m = Math.max(m, Math.ceil(minutesOf(now) / 15) * 15);
    return Math.min(m, 23 * 60);
  }
  const toTime = (m) => pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60);
  const fromTime = (s) => { const [h, mm] = s.split(":").map(Number); return h * 60 + mm; };

  function open(rid, clickMin) {
    room = data.rooms.find((r) => r.id === rid); if (!room) return;
    const f = $("form"); f.reset();
    sel = { setup: room.setups[0] || "", equipment: new Set() };
    $("dTitle").textContent = room.name;
    $("dPhoto").querySelector("img")?.remove();
    if (room.photo_url) $("dPhoto").insertAdjacentHTML("afterbegin", '<img src="' + esc(room.photo_url) + '" alt="">');
    const s = suggestStart(clickMin);
    f.start.value = toTime(s); f.end.value = toTime(Math.min(s + 60, 23 * 60 + 45));
    f.attendees.value = Math.min(2, room.capacity || 2);
    $("setupBox").hidden = !room.setups.length;
    $("setups").innerHTML = room.setups.map((x) => '<button type="button" data-setup="' + esc(x) + '" aria-pressed="' + (x === sel.setup) + '">' + esc(x) + "</button>").join("");
    $("equipBox").hidden = !room.equipment.length;
    $("equip").innerHTML = room.equipment.map((x) => '<button type="button" data-eq="' + esc(x) + '" aria-pressed="false">' + esc(x) + "</button>").join("");
    $("err").hidden = true;
    $("veil").hidden = false;
    document.body.style.overflow = "hidden";
    summary();
    setTimeout(() => f.title.focus(), 50);
  }
  function close() { $("veil").hidden = true; document.body.style.overflow = ""; }

  function summary() {
    const f = $("form");
    const s = fromTime(f.start.value || "00:00"), e = fromTime(f.end.value || "00:00");
    $("dur").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(e - s === +b.dataset.m)));
    const dlabel = new Date(day + "T12:00").toLocaleDateString("da-DK", { weekday: "long", day: "numeric", month: "long" });
    const clash = data.bookings.find((b) => b.room_id === room.id && fromMin(b.start) < e && fromMin(b.end) > s);
    $("sum").innerHTML = "<b>" + esc(room.name) + "</b> · " + esc(dlabel) + " kl. <span class=\"tm\">" + esc(f.start.value) + "–" + esc(f.end.value) + "</span>" +
      (+f.attendees.value ? " · " + (+f.attendees.value) + " pers." : "") + (sel.setup ? " · " + esc(sel.setup) : "") +
      (clash ? '<br><span class="err">Optaget ' + hm(new Date(clash.start)) + "–" + hm(new Date(clash.end)) + "</span>" : "") +
      (room.capacity && +f.attendees.value > room.capacity ? '<br><span class="err">Der er plads til ' + room.capacity + "</span>" : "");
  }
  function fromMin(isoStr) {
    const d = new Date(isoStr);
    if (iso(d) < day) return 0;
    if (iso(d) > day) return 24 * 60;
    return minutesOf(d);
  }

  $("days").addEventListener("click", (e) => {
    const b = e.target.closest("[data-day]"); if (!b) return;
    day = b.dataset.day; days(); load();
  });
  $("people").addEventListener("change", renderRooms);
  $("rooms").addEventListener("click", (e) => {
    const b = e.target.closest("[data-book]");
    if (b) return open(+b.dataset.book);
    const tl = e.target.closest(".tl");
    if (tl) {
      const box = tl.getBoundingClientRect();
      open(+tl.dataset.room, H0 * 60 + ((e.clientX - box.left) / box.width) * (H1 - H0) * 60);
    }
  });
  $("rooms").addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".tl")) { e.preventDefault(); open(+e.target.dataset.room); }
  });
  $("mine").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-cancel]"); if (!b) return;
    if (!confirm("Aflys bookingen?")) return;
    const r = await fetch(api + "/" + b.dataset.cancel, { method: "DELETE" });
    toast(r.ok ? "Bookingen er aflyst" : "Det gik ikke. Prøv igen");
    load();
  });
  $("dClose").addEventListener("click", close);
  $("veil").addEventListener("click", (e) => { if (e.target === $("veil")) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("veil").hidden) close(); });
  $("dur").addEventListener("click", (e) => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    const f = $("form"); f.end.value = toTime(Math.min(fromTime(f.start.value) + +b.dataset.m, 23 * 60 + 45)); summary();
  });
  $("setups").addEventListener("click", (e) => {
    const b = e.target.closest("[data-setup]"); if (!b) return;
    sel.setup = sel.setup === b.dataset.setup ? "" : b.dataset.setup;
    $("setups").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.setup === sel.setup)));
    summary();
  });
  $("equip").addEventListener("click", (e) => {
    const b = e.target.closest("[data-eq]"); if (!b) return;
    sel.equipment.has(b.dataset.eq) ? sel.equipment.delete(b.dataset.eq) : sel.equipment.add(b.dataset.eq);
    b.setAttribute("aria-pressed", String(sel.equipment.has(b.dataset.eq)));
  });
  const step = (d) => { const f = $("form"); f.attendees.value = Math.max(0, Math.min(1000, (+f.attendees.value || 0) + d)); summary(); };
  $("minus").addEventListener("click", () => step(-1));
  $("plus").addEventListener("click", () => step(1));
  $("form").addEventListener("input", summary);
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const s = fromTime(f.start.value), en = fromTime(f.end.value);
    const endDay = en <= s ? null : day;
    if (!endDay) { $("err").textContent = "Sluttidspunktet skal være efter starttidspunktet"; $("err").hidden = false; return; }
    $("send").disabled = true;
    try {
      const r = await fetch(api, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
        room_id: room.id, title: f.title.value.trim(), start: day + "T" + f.start.value, end: day + "T" + f.end.value,
        attendees: +f.attendees.value || 0, setup: sel.setup, equipment: [...sel.equipment], note: f.note.value.trim() }) });
      const j = await r.json();
      if (!r.ok) {
        $("err").textContent = typeof j.detail === "string" ? j.detail : "Tjek felterne og prøv igen";
        $("err").hidden = false; return;
      }
      close(); toast(room.name + " er booket kl. " + f.start.value + "–" + f.end.value); load();
    } catch (err) {
      $("err").textContent = "Ingen forbindelse. Prøv igen"; $("err").hidden = false;
    } finally { $("send").disabled = false; }
  });

  let toastT;
  function toast(msg) {
    $("toast").textContent = msg; $("toast").hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { $("toast").hidden = true; }, 3500);
  }

  days(); load();
  setInterval(() => { if ($("veil").hidden) load(); }, 60000);
})();
</script>
</body>
</html>
