<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invitér en gæst</title>
<link rel="icon" href="/static/brand/nodd-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/nodd-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Værtens egen side: invitér gæster uden login. Til telefon og computer. --brand = kundens farve. */
:root{--brand:#12352e;--ink:#14171d;--soft:#5d6470;--paper:#f4f5f2;--card:#fff;--rule:#e2e4e0;--ok:#14955f;--bad:#cf3a30;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;gap:14px}
.logo{height:50px;min-width:90px;background:#fff;border:1px solid var(--rule);border-radius:12px;display:grid;place-items:center;padding:6px 12px}
.logo img{max-height:34px;max-width:140px;object-fit:contain}
.logo b{font-family:var(--f-display)}
.head small{color:var(--soft);display:block}
.head strong{font-family:var(--f-display);font-size:1.15rem}
h1{font-family:var(--f-display);font-size:1.8rem;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-family:var(--f-display);font-size:1.15rem;margin:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--soft)}
input{font:500 1rem var(--f-body);border:1px solid var(--rule);border-radius:11px;padding:11px 12px;background:#fbfbfa;min-width:0;width:100%}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab,var(--brand) 18%,transparent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.hint{font-size:.8rem;color:var(--soft);font-weight:500}
button{font:700 1rem var(--f-body);border-radius:999px;border:0;cursor:pointer;min-height:48px;padding:0 20px}
.pri{background:var(--brand);color:#fff}
.ghost{background:#fff;border:1px solid var(--rule);min-height:36px;padding:0 14px;font-size:.85rem}
.ok{background:#e1f4ea;border:1px solid #bfe6cf;border-radius:14px;padding:14px 16px}
.ok b{font-family:var(--f-mono);font-size:1.2rem;letter-spacing:.12em}
.err{color:var(--bad);font-weight:600}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item b{display:block}
.item small{color:var(--soft)}
.code{font-family:var(--f-mono);font-weight:500;background:var(--paper);border-radius:8px;padding:3px 8px}
.empty{color:var(--soft)}
.foot{color:var(--soft);font-size:.8rem;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="head"><div class="logo" id="logo"></div><div><small>Invitationer fra</small><strong id="host"></strong></div></div>
  <h1>Invitér en gæst</h1>
  <form class="card" id="form" autocomplete="off">
    <label>Gæstens navn<input name="guest_name" required maxlength="120"></label>
    <div class="row">
      <label>Mobil<input name="guest_phone" type="tel" maxlength="40" placeholder="Til SMS med koden"></label>
      <label>E-mail<input name="guest_email" type="email" maxlength="200" placeholder="Til mail med QR-kode"></label>
    </div>
    <label>Firma (valgfrit)<input name="guest_company" maxlength="120"></label>
    <div class="row">
      <label>Dato<input name="date" type="date" required></label>
      <label>Tid<input name="time" type="time" required></label>
    </div>
    <span class="hint">Gæsten får en SMS og/eller mail med en kode og en QR-kode. Når de tjekker ind med den, får du besked med det samme.</span>
    <button class="pri" type="submit" id="send">Send invitation</button>
    <div class="ok" id="ok" hidden></div>
    <p class="err" id="err" hidden></p>
  </form>
  <section class="card">
    <h2>Dine forventede gæster</h2>
    <div class="list" id="list"></div>
  </section>
  <p class="foot">Gem siden som bogmærke, så har du den altid ved hånden. Linket er personligt, så del det ikke.</p>
</main>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const token = decodeURIComponent(location.pathname.split("/").pop());
  const api = "/api/host/" + encodeURIComponent(token);
  const f = $("form");
  const pad = (n) => (n < 10 ? "0" : "") + n;
  // Standard: næste hele time i dag. Efter kl. 22 i morgen kl. 9.
  const now = new Date(); f.date.min = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  const d = new Date(now); if (d.getHours() >= 22) { d.setDate(d.getDate() + 1); d.setHours(9, 0); } else d.setHours(d.getHours() + 1, 0);
  f.date.value = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); f.time.value = pad(d.getHours()) + ":00";
  function render(info) {
    document.documentElement.style.setProperty("--brand", info.color || "#12352e");
    $("logo").innerHTML = info.logo_url ? '<img src="' + esc(info.logo_url) + '" alt="' + esc(info.tenant) + '">' : "<b>" + esc(info.tenant) + "</b>";
    $("host").textContent = info.host;
    $("list").innerHTML = info.upcoming.map((x) => '<div class="item"><div class="grow"><b>' + esc(x.guest_name) + "</b><small>" + esc(x.when) +
      (x.guest_company ? " · " + esc(x.guest_company) : "") + ' · kode <span class="code">' + esc(x.code) + '</span></small></div><button class="ghost" type="button" data-cancel="' + x.id + '">Annullér</button></div>').join("") ||
      '<p class="empty">Ingen forventede gæster lige nu.</p>';
  }
  async function load() {
    const r = await fetch(api, { cache: "no-store" }); const j = await r.json();
    if (!r.ok) { document.querySelector("main").innerHTML = "<h1>Linket virker ikke</h1><p>" + esc(j.detail || "") + "</p>"; return; }
    render(j);
  }
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); $("err").hidden = true; $("ok").hidden = true; $("send").disabled = true;
    const body = { guest_name: f.guest_name.value.trim(), guest_phone: f.guest_phone.value.trim(), guest_email: f.guest_email.value.trim(),
      guest_company: f.guest_company.value.trim(), expected_at: f.date.value + "T" + f.time.value, send: true };
    try {
      const r = await fetch(api + "/invitations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await r.json();
      if (!r.ok) { let m = j.detail; if (Array.isArray(m)) m = m.map((x) => (x.msg || "").replace(/^Value error, /, "")).join(". "); throw new Error(m || "Noget gik galt"); }
      $("ok").innerHTML = esc(j.guest_name) + " er inviteret med koden <b>" + esc(j.code) + "</b>. " + (body.guest_phone && body.guest_email ? "Koden er sendt på SMS og mail." : body.guest_phone ? "Koden er sendt på SMS." : "Koden er sendt på mail.");
      $("ok").hidden = false;
      ["guest_name", "guest_phone", "guest_email", "guest_company"].forEach((k) => (f[k].value = ""));
      load();
    } catch (err) { $("err").textContent = err.message; $("err").hidden = false; }
    $("send").disabled = false;
  });
  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-cancel]"); if (!b) return;
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Tryk igen"; setTimeout(() => { delete b.dataset.sure; b.textContent = "Annullér"; }, 3000); return; }
    await fetch(api + "/invitations/" + b.dataset.cancel, { method: "DELETE" }); load();
  });
  load();
})();
</script>
</body>
</html>
