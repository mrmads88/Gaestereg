# main       -> tester og udruller til DEV
# production -> tester og udruller til PROD
# Pull requests -> kører kun tests
name: Test og udrul

on:
  push:
    branches: [main, production]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Testene kører både på SQLite (lokalt) og SQL Server (som Azure SQL i dev og prod).
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mssql]
    services:
      mssql:
        image: ${{ matrix.db == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Test_Passw0rd!
          MSSQL_COLLATION: Danish_Norwegian_CI_AS
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Opret testdatabase i SQL Server
        if: matrix.db == 'mssql'
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18"; then
            curl -sSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -o ms.deb
            sudo dpkg -i ms.deb && sudo apt-get update -q && sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18
          fi
          python - <<'PY'
          import time, pyodbc
          cs = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=Test_Passw0rd!;TrustServerCertificate=yes"
          for _ in range(30):
              try:
                  c = pyodbc.connect(cs, autocommit=True); break
              except pyodbc.Error:
                  time.sleep(3)
          c.execute("CREATE DATABASE gaestereg_test")
          PY
          echo "DATABASE_URL=mssql+pyodbc://sa:Test_Passw0rd%21@localhost:1433/gaestereg_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes" >> "$GITHUB_ENV"
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'production')
    runs-on: ubuntu-latest
    # GitHub-miljøerne "dev" og "production" har hver deres secrets og variabler.
    # Sæt "Required reviewers" på production, hvis prod-udrulning skal godkendes.
    environment:
      name: ${{ github.ref_name == 'production' && 'production' || 'dev' }}
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pak koden
        run: zip -r app.zip . -x '.git/*' '.github/*' 'tests/*' 'data/*' 'docs/*' 'infra/*' 'tools/*' '.venv/*' '*.pyc'
      - name: Udrul til Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
      - name: Tjek at appen svarer
        # Gratis-planen (F1) har ingen "Always On", og databasen kan være på pause. Første start kan tage et par minutter.
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 60 "${{ steps.deploy.outputs.webapp-url }}/healthz"; then exit 0; fi
            sleep 15
          done
          echo "Appen svarer ikke på /healthz. Se loggen under App Service > Log stream." && exit 1
